name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Fast: runs on every PR + push. macOS-only. No model downloads. No
  # heavy ML inference. `PANOPS_SKIP_HEAVY=1` gates the bilingual +
  # vad-conformance tests. Tests gated on `PANOPS_MODEL` / `PANOPS_DIAR_*`
  # env vars self-skip when those vars are unset (see `conformance_real.rs`
  # etc.). Linux compile portability is covered by the `clippy (ubuntu-latest)`
  # job above (clippy uses `--all-targets` so it compiles every test crate).
  # Wall clock target: ~3-5 min on macos-latest.
  test:
    name: test (macos-latest)
    runs-on: macos-latest
    env:
      PANOPS_SKIP_HEAVY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.81.10
        with:
          tool: cargo-nextest
      # rust-cache strips `target/<profile>/build/*/out` from the cache to keep
      # it small, which deletes sherpa-rs-sys's downloaded prebuilt libs while
      # keeping its rlib. The rlib then references nonexistent link paths and
      # the test link fails. Force sherpa-rs-sys to rebuild its build script
      # output (it re-downloads from its own ~/.../Caches/sherpa-rs cache).
      - name: Force sherpa-rs-sys rebuild
        shell: bash
        run: cargo clean -p sherpa-rs-sys || true
      - name: Run tests
        run: cargo nextest run --workspace --locked
      - name: Doc tests
        run: cargo test --workspace --locked --doc
      - name: Build Mac shell
        working-directory: apps/Panops
        run: |
          swift build --configuration release
          swift test

  # Heavy: real Whisper + sherpa-onnx diarization + Silero VAD inference.
  # Runs on `push: main`, the weekly cron, and manual workflow_dispatch.
  # Skipped on PR validation so reviewers don't wait 20+ minutes; the
  # tests still run on every merge to main so regressions are caught
  # before the next slice depends on them.
  #
  # Uses `ggml-tiny-q5_1` instead of `ggml-base-q5_1` — slice 09 smoke
  # showed bilingual recursion still detects both languages with tiny
  # (recall is lower but the current assertions pass). Saves ~30-40% of
  # the CI Whisper inference budget on CPU-only runners.
  heavy-test:
    name: heavy-test (macos)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      PANOPS_MODEL: ${{ github.workspace }}/.panops-models/ggml-tiny-q5_1.bin
      PANOPS_DIAR_SEG: ${{ github.workspace }}/.panops-models/sherpa-onnx-pyannote-segmentation-3-0/model.onnx
      PANOPS_DIAR_EMB: ${{ github.workspace }}/.panops-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
      PANOPS_VAD_MODEL: ${{ github.workspace }}/.panops-models/ggml-silero-v6.2.0.bin
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache models
        uses: actions/cache@v5
        with:
          path: .panops-models
          key: panops-models-v4-tiny-${{ hashFiles('crates/panops-portable/src/model.rs') }}
      - name: Ensure ASR model (tiny for CI)
        shell: bash
        env:
          MODEL_SHA256: 818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7
        run: |
          mkdir -p .panops-models
          if [ ! -f "$PANOPS_MODEL" ]; then
            curl -fL -o "$PANOPS_MODEL.partial" \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
            mv "$PANOPS_MODEL.partial" "$PANOPS_MODEL"
          fi
          actual=$(shasum -a 256 "$PANOPS_MODEL" | awk '{print $1}')
          if [ "$actual" != "$MODEL_SHA256" ]; then
            echo "asr model checksum mismatch: expected $MODEL_SHA256, got $actual" >&2
            rm -f "$PANOPS_MODEL"
            exit 1
          fi
      - name: Ensure diarization models
        shell: bash
        env:
          SEG_SHA256: 24615ee884c897d9d2ba09bb4d30da6bb1b15e685065962db5b02e76e4996488
          EMB_SHA256: 1a331345f04805badbb495c775a6ddffcdd1a732567d5ec8b3d5749e3c7a5e4b
        run: |
          mkdir -p .panops-models
          # Segmentation tarball
          SEG_TAR=.panops-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          if [ ! -f "$PANOPS_DIAR_SEG" ]; then
            curl -fL -o "$SEG_TAR.partial" \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
            mv "$SEG_TAR.partial" "$SEG_TAR"
            actual=$(shasum -a 256 "$SEG_TAR" | awk '{print $1}')
            if [ "$actual" != "$SEG_SHA256" ]; then
              echo "diar seg tarball checksum mismatch: expected $SEG_SHA256, got $actual" >&2
              rm -f "$SEG_TAR"
              exit 1
            fi
            tar -xjf "$SEG_TAR" -C .panops-models
            if [ ! -f "$PANOPS_DIAR_SEG" ]; then
              echo "expected $PANOPS_DIAR_SEG after tar extract; sherpa-onnx archive layout changed?" >&2
              exit 1
            fi
          fi
          # Embedding model
          if [ ! -f "$PANOPS_DIAR_EMB" ]; then
            curl -fL -o "$PANOPS_DIAR_EMB.partial" \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
            mv "$PANOPS_DIAR_EMB.partial" "$PANOPS_DIAR_EMB"
            actual=$(shasum -a 256 "$PANOPS_DIAR_EMB" | awk '{print $1}')
            if [ "$actual" != "$EMB_SHA256" ]; then
              echo "diar emb checksum mismatch: expected $EMB_SHA256, got $actual" >&2
              rm -f "$PANOPS_DIAR_EMB"
              exit 1
            fi
          fi
      - name: Ensure VAD model
        shell: bash
        env:
          VAD_SHA256: 2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987
        run: |
          mkdir -p .panops-models
          if [ ! -f "$PANOPS_VAD_MODEL" ]; then
            curl -fL -o "$PANOPS_VAD_MODEL.partial" \
              https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
            mv "$PANOPS_VAD_MODEL.partial" "$PANOPS_VAD_MODEL"
          fi
          actual=$(shasum -a 256 "$PANOPS_VAD_MODEL" | awk '{print $1}')
          if [ "$actual" != "$VAD_SHA256" ]; then
            echo "vad model checksum mismatch: expected $VAD_SHA256, got $actual" >&2
            rm -f "$PANOPS_VAD_MODEL"
            exit 1
          fi
      - uses: taiki-e/install-action@v2.81.10
        with:
          tool: cargo-nextest
      - name: Force sherpa-rs-sys rebuild
        shell: bash
        run: cargo clean -p sherpa-rs-sys || true
      - name: Build WhisperKit sidecar
        working-directory: apps/panops-asr-mac
        run: swift build --configuration release
      - name: Export ASR sidecar path
        run: |
          echo "PANOPS_ASR_SIDECAR_BIN=${{ github.workspace }}/apps/panops-asr-mac/.build/release/panops-asr-mac" >> "$GITHUB_ENV"
      - name: Run heavy tests
        run: cargo nextest run --workspace --locked
      - name: Doc tests
        run: cargo test --workspace --locked --doc

  # panops-llm-mac declares swift-tools-version 6.2 (FoundationModels), so it
  # needs the macos-26 image (Xcode 26.x / Swift 6.2). The default macos-latest
  # runner ships Swift 6.1 and cannot build it. Build-only (no swift test):
  # FoundationModels runtime availability in CI is unverified — mirrors the
  # asr-mac build-only pattern in heavy-test.
  build-llm-sidecar:
    name: build-llm-sidecar (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Build LLM sidecar
        working-directory: apps/panops-llm-mac
        run: swift build --configuration release

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check all

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1.47.2

  audit-scheduled:
    name: scheduled audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check advisories

  package:
    name: package (ad-hoc .app)
    # Skip on PR validation (full release build of engine + 3 swift targets is
    # slow); runs on merge to main, the weekly cron, and manual dispatch —
    # mirrors heavy-test, so bundle/signing breakage is caught before release.
    if: github.event_name != 'pull_request'
    # macos-26: package.sh builds panops-llm-mac, whose Package.swift needs
    # swift-tools 6.2 (only on macos-26's toolchain, like build-llm-sidecar);
    # macos-latest ships Swift 6.1 and fails the manifest. See #222.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
      - uses: Swatinem/rust-cache@v2
      - name: Build + assemble + ad-hoc sign
        run: bash scripts/package.sh ci-${{ github.sha }}
      - name: Verify signature
        run: codesign --verify --deep --strict dist/Panops.app
